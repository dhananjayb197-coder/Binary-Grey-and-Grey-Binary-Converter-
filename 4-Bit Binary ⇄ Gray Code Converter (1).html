<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4-Bit Binary ⇄ Gray Code Converter</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#0b1220;color:#e2e8f0;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
button:focus-visible{outline:2px solid #22d3ee;outline-offset:3px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement, { useState } = React;
const toBits = n => [(n >> 3) & 1, (n >> 2) & 1, (n >> 1) & 1, n & 1];
const toNum = b => b[0] * 8 + b[1] * 4 + b[2] * 2 + b[3];
const b2g = b => [b[0], b[0] ^ b[1], b[1] ^ b[2], b[2] ^ b[3]];
const g2b = g => { const o = [g[0]]; for (let i = 1; i < 4; i++) o.push(o[i - 1] ^ g[i]); return o; };
const A = "#22d3ee", OFF = "#334155";
const card = "rounded-2xl border border-slate-700/70 bg-[#111c2f] p-5 sm:p-7";

const Section = ({ title, sub, children }) => h("section", { className: card + " space-y-5" },
  h("div", null, h("h2", { className: "text-xl sm:text-2xl font-semibold text-white" }, title), sub && h("p", { className: "text-slate-400 text-sm mt-1" }, sub)), children);

/* ---------- Formula blocks ---------- */
const Badge = ({ t }) => t ? h("span", { className: "mono text-xs px-2 py-0.5 rounded-md border " + (t === "MSB" ? "border-blue-400 text-blue-300 bg-blue-500/10" : "border-fuchsia-400 text-fuchsia-300 bg-fuchsia-500/10") }, t) : h("span", { className: "w-[42px]" });
const Formula = ({ title, rule, rows, active }) => h("div", { className: "rounded-xl border p-4 space-y-3 transition-colors " + (active ? "border-cyan-400/70 bg-cyan-400/5" : "border-slate-700 bg-slate-900/40") },
  h("h3", { className: "font-semibold text-white" }, title),
  h("p", { className: "text-sm text-slate-400" }, rule),
  rows.map(r => h("div", { key: r[0], className: "flex items-center gap-3 mono" },
    h(Badge, { t: r[2] }),
    h("span", { className: "w-9 text-cyan-300 font-bold" }, r[0]), h("span", { className: "text-slate-500" }, "="),
    h("span", { className: "px-3 py-1 rounded-lg bg-slate-800 border border-slate-600 text-slate-100" }, r[1]))));

/* ---------- Switch & LED ---------- */
const Switch = ({ on, label, sub, onClick }) => h("button", { role: "switch", "aria-checked": !!on, "aria-label": label, onClick, className: "flex flex-col items-center gap-2 select-none" },
  h("span", { className: "mono text-xs " + (sub === "MSB" ? "text-blue-300" : sub === "LSB" ? "text-fuchsia-300" : "text-slate-500") }, sub || "\u00a0"),
  h("span", { className: "relative block w-[72px] sm:w-20 h-32 rounded-2xl border-2 transition-all duration-200 " + (on ? "bg-cyan-500/20 border-cyan-400 shadow-[0_0_24px_rgba(34,211,238,0.45)]" : "bg-slate-800 border-slate-600") },
    h("span", { className: "absolute left-1.5 right-1.5 h-14 rounded-xl transition-all duration-200 flex items-center justify-center text-3xl font-bold mono " + (on ? "top-1.5 bg-cyan-400 text-slate-900" : "bottom-1.5 bg-slate-600 text-slate-300") }, on ? 1 : 0)),
  h("span", { className: "text-sm font-semibold " + (on ? "text-cyan-300" : "text-slate-400") }, label));

const Led = ({ on, label }) => h("div", { className: "flex flex-col items-center gap-2" },
  h("div", { className: "w-14 h-14 sm:w-16 sm:h-16 rounded-full border-2 transition-all duration-200 " + (on ? "bg-emerald-300 border-emerald-100 shadow-[0_0_30px_8px_rgba(52,211,153,0.65)]" : "bg-slate-900 border-slate-700") }),
  h("span", { className: "mono text-sm " + (on ? "text-emerald-300" : "text-slate-500") }, label + " = " + (on ? 1 : 0)));

/* ---------- Circuit diagram ---------- */
function Circuit({ mode, bits, out }) {
  const bin = mode === "b2g", c = v => v ? A : OFF, rows = [40, 120, 200, 280];
  const inN = bin ? ["B3", "B2", "B1", "B0"] : ["G3", "G2", "G1", "G0"];
  const outN = bin ? ["G3", "G2", "G1", "G0"] : ["B3", "B2", "B1", "B0"];
  const wires = [], gates = [], dots = [];
  const W = (pts, v) => wires.push([pts, v]);
  let outY, gx, gcy = [80, 160, 240];
  // each gate: [x, cy, inA, inB, result]
  if (bin) {
    gx = [330, 330, 330]; outY = [40, 80, 160, 240];
    W("70,40 700,40", bits[0]);
    W("260,40 260,68 330,68", bits[0]);
    W("70,120 260,120", bits[1]); W("260,120 260,92 330,92", bits[1]); W("260,120 260,148 330,148", bits[1]);
    W("70,200 260,200", bits[2]); W("260,200 260,172 330,172", bits[2]); W("260,200 260,228 330,228", bits[2]);
    W("70,280 260,280 260,252 330,252", bits[3]);
    [1, 2, 3].forEach(k => W("400," + gcy[k - 1] + " 700," + gcy[k - 1], out[k]));
    [[40, 0], [120, 1], [200, 2]].forEach(d => dots.push([260, d[0], bits[d[1]]]));
    gates.push([330, 80, bits[0], bits[1], out[1]], [330, 160, bits[1], bits[2], out[2]], [330, 240, bits[2], bits[3], out[3]]);
  } else {
    gx = [250, 400, 550]; outY = [40, 80, 160, 240];
    W("70,40 700,40", bits[0]); W("220,40 220,68 250,68", bits[0]);
    W("70,120 230,120 230,92 250,92", bits[1]);
    W("320,80 700,80", out[1]); W("360,80 360,148 400,148", out[1]);
    W("70,200 370,200 370,172 400,172", bits[2]);
    W("470,160 700,160", out[2]); W("510,160 510,228 550,228", out[2]);
    W("70,280 525,280 525,252 550,252", bits[3]);
    W("620,240 700,240", out[3]);
    dots.push([220, 40, bits[0]], [360, 80, out[1]], [510, 160, out[2]]);
    gates.push([250, 80, bits[0], bits[1], out[1]], [400, 160, out[1], bits[2], out[2]], [550, 240, out[2], bits[3], out[3]]);
  }
  return h("div", { className: "overflow-x-auto" },
    h("svg", { viewBox: "0 0 780 320", className: "w-full min-w-[640px]", role: "img", "aria-label": "Chain of three XOR gates" },
      wires.map((w, i) => h("polyline", { key: "w" + i, points: w[0], fill: "none", stroke: c(w[1]), strokeWidth: w[1] ? 3.5 : 2.5, strokeLinejoin: "round", style: { transition: "stroke .2s", filter: w[1] ? "drop-shadow(0 0 4px #22d3ee)" : "none" } })),
      dots.map((d, i) => h("circle", { key: "d" + i, cx: d[0], cy: d[1], r: 4.5, fill: c(d[2]) })),
      gates.map((g, i) => { const x = g[0], y = g[1];
        return h("g", { key: "g" + i },
          h("path", { d: `M${x},${y - 25} Q${x + 35},${y - 25} ${x + 70},${y} Q${x + 35},${y + 25} ${x},${y + 25} Q${x + 18},${y} ${x},${y - 25}Z`, fill: g[4] ? "rgba(34,211,238,0.14)" : "#0f172a", stroke: c(g[4]), strokeWidth: 3, style: { transition: "all .2s" } }),
          h("path", { d: `M${x - 8},${y - 25} Q${x + 10},${y} ${x - 8},${y + 25}`, fill: "none", stroke: c(g[4]), strokeWidth: 3 }),
          h("text", { x: x + 28, y: y + 5, textAnchor: "middle", fontSize: 13, fontWeight: 700, fill: g[4] ? "#a5f3fc" : "#94a3b8", className: "mono" }, "XOR"),
          h("text", { x: x + 28, y: y - 32, textAnchor: "middle", fontSize: 11, fill: "#64748b", className: "mono" }, g[2] + "⊕" + g[3] + "=" + g[4])); }),
      rows.map((y, i) => h("g", { key: "i" + i },
        h("text", { x: 8, y: y + 5, fontSize: 14, fontWeight: 700, fill: "#cbd5e1", className: "mono" }, inN[i]),
        h("circle", { cx: 58, cy: y, r: 9, fill: bits[i] ? A : "#0f172a", stroke: c(bits[i]), strokeWidth: 2 }))),
      outY.map((y, i) => h("g", { key: "o" + i },
        h("circle", { cx: 712, cy: y, r: 10, fill: out[i] ? "#6ee7b7" : "#0f172a", stroke: out[i] ? "#a7f3d0" : OFF, strokeWidth: 2, style: { filter: out[i] ? "drop-shadow(0 0 8px #34d399)" : "none" } }),
        h("text", { x: 732, y: y + 5, fontSize: 14, fontWeight: 700, fill: out[i] ? "#6ee7b7" : "#64748b", className: "mono" }, outN[i])))));
}

/* ---------- App ---------- */
function App() {
  const [mode, setMode] = useState("b2g"), [bits, setBits] = useState([0, 1, 1, 0]);
  const bin = mode === "b2g", out = bin ? b2g(bits) : g2b(bits), row = toNum(bin ? bits : out);
  const flip = i => setBits(bits.map((v, j) => j === i ? v ^ 1 : v));
  const swap = m => { if (m !== mode) { setBits(out); setMode(m); } };
  const next = () => { const n = (row + 1) % 16; setBits(bin ? toBits(n) : b2g(toBits(n))); };
  const names = bin ? ["B3", "B2", "B1", "B0"] : ["G3", "G2", "G1", "G0"], onames = bin ? ["G3", "G2", "G1", "G0"] : ["B3", "B2", "B1", "B0"];
  const sub = ["MSB", "", "", "LSB"];
  const tab = m => "flex-1 px-4 py-2.5 rounded-xl text-sm sm:text-base font-semibold transition-colors " + (mode === m ? "bg-blue-600 text-white shadow-[0_0_18px_rgba(59,130,246,0.5)]" : "bg-slate-800 text-slate-300 hover:bg-slate-700");
  const digits = b => b.map((v, i) => h("span", { key: i, className: v ? "text-cyan-300" : "text-slate-500" }, v));

  return h("main", { className: "max-w-5xl mx-auto px-4 py-8 sm:py-12 space-y-6" },
    /* 1. header */
    h("header", { className: card + " space-y-5 bg-gradient-to-br from-[#14233f] to-[#0f1a2e]" },
      h("p", { className: "mono text-sm text-blue-300" }, "Digital Electronics & Computer Organisation · Mini-project"),
      h("h1", { className: "text-3xl sm:text-5xl font-bold text-white leading-tight" }, "4-Bit Binary ⇄ Gray Code Converter"),
      h("p", { className: "text-slate-300 max-w-3xl" }, h("strong", { className: "text-white" }, "Objective: "), "design and verify a combinational circuit that converts a 4-bit binary number to Gray code and back, using only XOR gates, and see why Gray code is the safe choice whenever a changing value is read at the wrong moment."),
      h("div", { className: "grid md:grid-cols-2 gap-4" },
        h("div", { className: "rounded-xl border border-slate-700 bg-slate-900/50 p-4" },
          h("h3", { className: "font-semibold text-cyan-300 mb-1" }, "Rotary encoders"),
          h("p", { className: "text-sm text-slate-300" }, "An absolute encoder disc is read by several sensors at once. In binary, moving from 0111 to 1000 flips four bits, and sensors that switch at slightly different instants can briefly read a wildly wrong position such as 1111. In Gray code only one bit changes per step, so a misread is never more than one position off.")),
        h("div", { className: "rounded-xl border border-slate-700 bg-slate-900/50 p-4" },
          h("h3", { className: "font-semibold text-cyan-300 mb-1" }, "Asynchronous FIFO clock-domain crossing"),
          h("p", { className: "text-sm text-slate-300" }, "A FIFO’s read and write pointers live in different clock domains. Sending them as binary risks a synchroniser catching several bits mid-change. Sending them as Gray code means it sees either the old or the new pointer, never a corrupt one, so the full and empty flags stay trustworthy.")))),

    /* 2. formulas */
    h(Section, { title: "Concept and formula guide", sub: "The MSB is always copied unchanged. Every other bit comes from an XOR (⊕)." },
      h("div", { className: "grid md:grid-cols-2 gap-4" },
        h(Formula, { title: "Binary → Gray", rule: "Each Gray bit is the XOR of the binary bit and the binary bit above it.", active: bin, rows: [["G3", "B3", "MSB"], ["G2", "B3 ⊕ B2"], ["G1", "B2 ⊕ B1"], ["G0", "B1 ⊕ B0", "LSB"]] }),
        h(Formula, { title: "Gray → Binary", rule: "Each binary bit is the XOR of the binary bit above it and the Gray bit. The result ripples down the chain.", active: !bin, rows: [["B3", "G3", "MSB"], ["B2", "B3 ⊕ G2"], ["B1", "B2 ⊕ G1"], ["B0", "B1 ⊕ G0", "LSB"]] }))),

    /* 3. simulator */
    h(Section, { title: "Real-time simulator", sub: "Flip the switches and watch the output vector respond." },
      h("div", { className: "flex gap-2 p-1 rounded-2xl bg-slate-900", role: "tablist" },
        h("button", { role: "tab", "aria-selected": bin, className: tab("b2g"), onClick: () => swap("b2g") }, "Binary to Gray mode"),
        h("button", { role: "tab", "aria-selected": !bin, className: tab("g2b"), onClick: () => swap("g2b") }, "Gray to Binary mode")),
      h("div", null, h("p", { className: "text-sm text-slate-400 mb-3" }, "Input: " + (bin ? "binary" : "Gray code") + " (Bit 3 down to Bit 0)"),
        h("div", { className: "flex justify-center gap-3 sm:gap-8" }, bits.map((v, i) => h(Switch, { key: i, on: v, label: "Bit " + (3 - i), sub: sub[i], onClick: () => flip(i) })))),
      h("div", { className: "border-t border-slate-700 pt-5" },
        h("p", { className: "text-sm text-slate-400 mb-3 text-center" }, "Output: " + (bin ? "Gray code" : "binary")),
        h("div", { className: "flex justify-center gap-4 sm:gap-8" }, out.map((v, i) => h(Led, { key: i, on: v, label: onames[i] })))),
      h("div", { className: "grid sm:grid-cols-3 gap-3 text-center mono" },
        [[bin ? "Binary in" : "Gray in", bits], [bin ? "Gray out" : "Binary out", out]].map(r => h("div", { key: r[0], className: "rounded-xl bg-slate-900 border border-slate-700 py-3" }, h("div", { className: "text-xs text-slate-400" }, r[0]), h("div", { className: "text-2xl tracking-[0.3em]" }, digits(r[1])))),
        h("div", { className: "rounded-xl bg-slate-900 border border-slate-700 py-3" }, h("div", { className: "text-xs text-slate-400" }, "Decimal value"), h("div", { className: "text-2xl text-blue-300" }, row))),
      h("div", { className: "flex flex-wrap gap-3 justify-center" },
        h("button", { onClick: next, className: "px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold" }, "Count up by 1"),
        h("button", { onClick: () => setBits([0, 0, 0, 0]), className: "px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold" }, "Reset to 0000"))),

    /* 4. circuit */
    h(Section, { title: "Live logic circuit", sub: "Cyan wires carry logic 1, slate wires carry logic 0. Each XOR gate lights up when its output is 1." },
      h(Circuit, { mode, bits, out })),

    /* 5. truth table */
    h(Section, { title: "Verification truth table", sub: "The highlighted row follows your simulator state." },
      h("div", { className: "overflow-x-auto rounded-xl border border-slate-700" },
        h("table", { className: "w-full text-center mono" },
          h("thead", null, h("tr", { className: "bg-slate-900 text-slate-300 text-sm" }, ["Decimal", "Binary (B3 B2 B1 B0)", "Gray (G3 G2 G1 G0)"].map(t => h("th", { key: t, className: "py-3 px-3 font-semibold" }, t)))),
          h("tbody", null, Array.from({ length: 16 }, (_, n) => { const b = toBits(n), g = b2g(b), on = n === row;
            return h("tr", { key: n, "aria-current": on ? "true" : undefined, className: "border-t border-slate-800 transition-colors " + (on ? "bg-cyan-400/15 shadow-[inset_4px_0_0_#22d3ee]" : "hover:bg-slate-800/40") },
              h("td", { className: "py-2 px-3 " + (on ? "text-white font-bold" : "text-slate-400") }, n),
              h("td", { className: "py-2 px-3 tracking-[0.35em]" }, digits(b)),
              h("td", { className: "py-2 px-3 tracking-[0.35em]" }, digits(g))); }))))),
    h("footer", { className: "text-center text-xs text-slate-500 pb-4" }, "Binary-to-Gray and Gray-to-Binary converter · 3 XOR gates, 4 bits")
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
